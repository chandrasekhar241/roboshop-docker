name : roboshop

services:
  mongodb:
    build: ./mongodb
    image: chandu4234/mongodb:v1
    container_name: mongodb
  catalogue:
    build: ./catalogue
    image: chandu4234/catalogue:v1
    container_name: catalogue
    depends_on:
    - mongodb
  frontend:
    build: ./frontend
    image: chandu4234/frontend:v1
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
  user:
    build: ./user
    image: chandu4234/user:v1
    container_name: user
    environment:
      MONGO: true
      REDIS_URL: 'redis://redis:6379'
      MONGO_URL: "mongodb://mongodb:27017/users"
    depends_on:
    - redis
    - mongodb

  cart:
    build: ./cart
    image: chandu4234/cart:v1
    container_name: cart
    environment:
      REDIS_HOST: redis
      CATALOGUE_HOST: catalogue
      CATALOGUE_PORT: 8080
    depends_on:
    - redis
    - catalogue
  mysql:
    build: ./mysql
    image: chandu4234/mysql:v1
    container_name: mysql
    command: --mysql-native-password=ON --innodb-lock_wait_timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: "RoboShop@1"

  redis:
    image: redis:7
    container_name: redis
networks:
  default:
    name: roboshop
    driver: bridge
    external: false