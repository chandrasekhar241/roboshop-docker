name : roboshop

services:
  mongodb:
    build: ./mongodb
    image: chandu4234/mongodb:4.0.0
    container_name: mongodb
    volumes:
      - mongodb:/data/db
  catalogue:
    build: ./catalogue
    image: chandu4234/catalogue:4.0.0
    container_name: catalogue
    depends_on:
    - mongodb
  frontend:
    build: ./frontend
    image: chandu4234/frontend:4.0.0
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - catalogue
      - user
      - cart
  user:
    build: ./user
    image: chandu4234/user:4.0.0
    container_name: user
    environment:
      MONGO: true
      REDIS_URL: 'redis://redis:6379'
      MONGO_URL: "mongodb://mongodb:27017/users"
    depends_on:
    - redis
    - mongodb

  cart:
    build: ./cart
    image: chandu4234/cart:4.0.0
    container_name: cart
    environment:
      REDIS_HOST: redis
      CATALOGUE_HOST: catalogue
      CATALOGUE_PORT: 8080
    depends_on:
    - redis
    - catalogue
  shipping:
    build: ./shipping
    image: chandu4234/shipping:4.0.0
    container_name: shipping
    environment:
      CART_ENDPOINT: "cart:8080"
      DB_HOST: mysql
    depends_on:
    - mysql
    - cart
  payment:
    build: ./payment
    image: chandu4234/payment:4.0.0
    container_name: payment
    environment:
      CART_HOST: "cart"
      CART_PORT: 8080
      USER_HOST: user
      USER_PORT: 8080
      AMQP_HOST: rabbitmq
      AMQP_USER: roboshop
      AMQP_PASS: roboshop123
    depends_on:
    - cart
    - user
    - rabbitmq
  
  mysql:
    build: ./mysql
    image: chandu4234/mysql:4.0.1
    container_name: mysql
    command: --innodb-lock_wait_timeout=120
    environment:
      MYSQL_ROOT_PASSWORD: "RoboShop@1"
    volumes:
      - mysql:/var/lib/mysql
  
  redis:
    image: redis:7
    container_name: redis
    volumes:
      - redis:/data
  rabbitmq:
    image: rabbitmq:3
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: roboshop
      RABBITMQ_DEFAULT_PASS: roboshop123
    volumes:
      - rabbitmq:/var/lib/rabbitmq
networks:
  default:
    name: roboshop
    driver: bridge
    external: false

volumes:
  mongodb:
  redis:
  mysql:
  rabbitmq: